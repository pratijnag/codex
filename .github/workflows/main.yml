name: Claude Commit Review

on:
  push:
    branches:
      - main

jobs:
  review:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Review latest commit
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          git diff HEAD^ HEAD > commit.diff

          claude -p "Review the latest commit using commit.diff.

          Check for:
          - Bugs or incorrect logic
          - Security issues
          - Code quality problems
          - Potential breaking changes

          Provide a concise review with the issues found.
          Do not modify any files." < commit.diff | tee review.txt

      # NEW: Send email after review
      - name: Send Review Email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}

          subject: Claude Commit Review - ${{ github.repository }}

          to: ${{ github.event.head_commit.author.email }}

          from: Claude Code Review

          body: |
            Hello,

            Claude has completed the review for the latest commit.

            Repository: ${{ github.repository }}
            Branch: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
            Author: ${{ github.event.head_commit.author.name }}

            Review:
            Please find the detailed review attached.

          attachments: review.txt
