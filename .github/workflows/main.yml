name: Claude Commit Review

on:
  push:
    branches-ignore:
      - main

jobs:
  review:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      # NEW: Create PR if it doesn't exist
      - name: Create Pull Request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="${{ github.ref_name }}"

          PR_NUMBER=$(gh pr list \
            --head "$BRANCH" \
            --base main \
            --state open \
            --json number \
            --jq '.[0].number')

          if [ -z "$PR_NUMBER" ]; then
            gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "Auto PR: $BRANCH" \
              --body "Automatically created Pull Request."
          else
            echo "PR already exists: #$PR_NUMBER"
          fi

      # EXISTING: Review latest commit
      - name: Review latest commit
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          git diff HEAD^ HEAD > commit.diff

          claude -p "Review the latest commit using commit.diff.

          Check for:
          - Bugs or incorrect logic
          - Security issues
          - Code quality problems
          - Potential breaking changes

          Provide a concise review with the issues found.
          Do not modify any files." < commit.diff | tee review.txt

      # NEW: Send email after review
      - name: Send Review Email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true

          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}

          subject: Claude Review - ${{ github.repository }}

          to: ${{ github.event.head_commit.author.email }}

          from: Claude Code Review

          body: |
            Hello,

            Claude has completed the code review.

            Repository: ${{ github.repository }}
            Branch: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
            Author: ${{ github.event.head_commit.author.name }}

            The detailed review is attached.

          attachments: review.txt
