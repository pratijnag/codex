name: Claude Commit Review

on:
  push:
    branches-ignore:
      - main

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Create or find pull request
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          NUMBER=$(gh pr list --head "${{ github.ref_name }}" --base main --json number --jq '.[0].number')
          if [ -z "$NUMBER" ]; then
            gh pr create \
              --base main \
              --head "${{ github.ref_name }}" \
              --title "Merge ${{ github.ref_name }} into main" \
              --body "Automated PR opened after push by @${{ github.actor }}."
            NUMBER=$(gh pr list --head "${{ github.ref_name }}" --base main --json number --jq '.[0].number')
          fi
          echo "number=$NUMBER" >> "$GITHUB_OUTPUT"

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Run Claude review
        id: run_claude
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          claude -p "You are reviewing the latest commit on this branch.

          Review ONLY the changes in the latest commit.

          Use:
          git diff HEAD^ HEAD

          Check for:
          - Bugs or incorrect logic
          - Security issues
          - Code quality problems
          - Potential breaking changes
          - Incorrect property or variable names
          - Null/reference errors
          - Unused or dead code
          - Exception handling problems

          For every issue found provide:

          **File:**
          **Line:**
          **Severity:**
          **Problem:**
          **Recommendation:**
          **Code:**

          If no issues are found, reply ONLY:

          No issues found. Looks good to merge." \
            --allowedTools "Read,Bash(git diff:*)" \
            --max-turns 3 \
            --model claude-sonnet-5 \
            --output-format json > claude_output.json

          OUTPUT=$(node -e "
            const fs = require('fs');
            const data = JSON.parse(fs.readFileSync('claude_output.json', 'utf8'));
            console.log(data.result || 'No review content returned.');
          ")

          {
            echo "final_message<<CLAUDE_EOF"
            echo "$OUTPUT"
            echo "CLAUDE_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Prepare email
        if: always()
        env:
          CLAUDE_OUTPUT: ${{ steps.run_claude.outputs.final_message }}
        run: |
          {
            echo "Claude Commit Review"
            echo ""
            echo "Repository: ${{ github.repository }}"
            echo "Pull Request: #${{ steps.pr.outputs.number }}"
            echo "Commit: ${{ github.sha }}"
            echo "Commit Message: ${{ github.event.head_commit.message }}"
            echo ""
            echo "========================================"
            echo ""
            echo "$CLAUDE_OUTPUT"
          } > email.txt

      - name: Send review by email
        if: always()
        uses: dawidd6/action-send-mail@v6
        with:
          connection_url: ${{ secrets.MAIL_CONNECTION_URL }}
          to: ${{ github.event.head_commit.author.email }}
          from: ${{ secrets.MAIL_FROM }}
          subject: "Claude Commit Review - ${{ github.repository }}"
          body: file://email.txt

      - name: Show Claude review
        if: always()
        env:
          CLAUDE_OUTPUT: ${{ steps.run_claude.outputs.final_message }}
        run: |
          echo "========================================"
          echo "CLAUDE COMMIT REVIEW"
          echo "========================================"
          echo "$CLAUDE_OUTPUT"
