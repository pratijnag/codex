name: Claude Commit Review

on:
  push:
    branches:
      - main

jobs:
  review:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Review latest commit
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          git diff HEAD^ HEAD > commit.diff

          claude -p "Review the latest commit using commit.diff.

          Check for:
          - Bugs or incorrect logic
          - Security issues
          - Code quality problems
          - Potential breaking changes

          Compare the latest commit with its parent commit.

          Provide a concise review with:
          - Issues found
          - Severity
          - File and line number where possible
          - Suggested fix

          Do not modify any files." < commit.diff > review.txt

          echo "===== CLAUDE REVIEW ====="
          cat review.txt

      - name: Send review by email
        uses: dawidd6/action-send-mail@v6
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "Claude Commit Review - ${{ github.repository }}"
          to: ${{ secrets.MAIL_TO }}
          from: ${{ secrets.MAIL_USERNAME }}
          body: file://review.txt
