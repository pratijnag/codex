name: Claude Commit Review

on:
  push:
    branches:
      - main

jobs:
  review:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      # STEP 1: Checkout latest commit
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      # STEP 2: Install Claude Code
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      # STEP 3: Generate Claude review
      - name: Review latest commit
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          git diff HEAD^ HEAD > commit.diff

          claude -p "Review the latest commit using commit.diff.

          Check for:
          - Bugs or incorrect logic
          - Security issues
          - Code quality problems
          - Potential breaking changes

          Compare the latest commit with its parent commit.

          Provide a concise review with:
          - Issues found
          - Severity
          - File and line number where possible
          - Suggested fix

          If issues are found, clearly list them.

          If there are no issues, reply:
          No issues found. Looks good to merge.

          Do not modify any files." < commit.diff > review.txt

          echo "===== CLAUDE REVIEW ====="
          cat review.txt

      # STEP 4: Create email content
      - name: Prepare email
        run: |
          echo "Claude Commit Review" > email.txt
          echo "" >> email.txt
          echo "Repository: ${{ github.repository }}" >> email.txt
          echo "Branch: main" >> email.txt
          echo "Commit: ${{ github.sha }}" >> email.txt
          echo "Commit Message: ${{ github.event.head_commit.message }}" >> email.txt
          echo "" >> email.txt
          echo "========================================" >> email.txt
          echo "" >> email.txt
          cat review.txt >> email.txt

      # STEP 5: Send Claude review by email
      - name: Send review by email
        uses: dawidd6/action-send-mail@v6
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          from: ${{ secrets.MAIL_USERNAME }}
          to: ${{ secrets.MAIL_TO }}
          subject: "Claude Commit Review - ${{ github.repository }}"
          body: file://email.txt
